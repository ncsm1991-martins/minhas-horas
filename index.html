<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Horas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F0;
  --bg2:#EEEEE9;
  --surface:#FFFFFF;
  --surface-2:#F2F2ED;
  --surface-3:#E8E8E3;
  --ink:#1A1A1A;
  --ink-2:rgba(26,26,26,.7);
  --muted:#888880;
  --line:#E2E2DC;
  --line2:#D0D0CA;
  --accent:#2B6B4E;
  --accent-2:#1F5239;
  --accent-soft:rgba(43,107,78,.1);
  --accent-ink:#FFFFFF;
  --warn:#C0392B;
  --warn-soft:rgba(192,57,43,.1);
  --good:#2B6B4E;
  --gold:#9A6F0A;
  --gold-soft:rgba(154,111,10,.1);
  --blue:#1A6BBF;
  --blue-soft:rgba(26,107,191,.1);
  --purple:#7B3FA0;
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,sans-serif;
  --hour:52px;
  --r:16px;
  --r-sm:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:800px;margin:0 auto;padding:0 16px 120px}

/* ── LOGIN ── */
.login-screen{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:28px;
  padding:32px 16px;text-align:center;
}
.login-logo{font:italic 400 48px var(--serif);margin:0;letter-spacing:-.02em}
.login-logo em{color:var(--accent);font-style:italic}
.login-sub{color:var(--muted);margin:0;font-size:15px;max-width:300px;line-height:1.5}
.google-btn{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line2);border-radius:14px;
  padding:14px 28px;font:600 15px var(--sans);
  box-shadow:0 4px 24px rgba(0,0,0,.4);
  transition:background .15s,transform .1s;color:var(--ink);
}
.google-btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.google-btn svg{width:20px;height:20px;flex-shrink:0}
.login-error{color:var(--warn);font-size:13px}

/* ── HEADER ── */
header.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:rgba(245,245,240,.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);padding:12px 0 0;
}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px}
h1.logo{font:italic 400 22px/1 var(--serif);margin:0;letter-spacing:-.01em;color:var(--ink)}
h1.logo em{color:var(--accent);font-style:italic}
.sync-dot{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 6px var(--accent);flex-shrink:0;
  transition:background .3s,box-shadow .3s;
}
.sync-dot.saving{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.sync-dot.error{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.sync-dot.offline{background:var(--muted);box-shadow:none}
.sync-row{display:flex;align-items:center;gap:6px}
.sync-label{font-size:11px;color:var(--muted)}
.user-btn{
  background:none;border:1px solid var(--line2);border-radius:999px;
  padding:4px 10px 4px 5px;display:flex;align-items:center;gap:7px;
  font-size:12px;color:var(--muted);transition:background .12s;
}
.user-btn:hover{background:var(--surface-2)}
.avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--surface-3)}
.datenav{display:flex;align-items:center;gap:8px;padding-bottom:10px}
.datenav .lbl{flex:1;text-align:center;font:500 15px var(--sans);color:var(--ink)}
.iconbtn{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line2);background:var(--surface);
  display:grid;place-items:center;font-size:17px;color:var(--muted);transition:background .12s;
}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.todaybtn{
  border:1px solid var(--line2);background:var(--surface);border-radius:999px;
  padding:5px 13px;font-size:12px;font-weight:500;color:var(--muted);transition:background .12s;
}
.todaybtn:hover{background:var(--surface-2);color:var(--ink)}
.tabs{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line);margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tabs-inner{display:flex}
.tabs button{
  border:0;background:transparent;padding:10px 18px 11px;
  font:500 13px var(--sans);color:var(--muted);
  white-space:nowrap;border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s;letter-spacing:.01em;
}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
section.view{padding-top:18px}

/* ── PANELS ── */
.panel{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:18px;margin-bottom:14px;
}
.panel-glass{
  background:rgba(28,28,30,.7);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
h2{font:italic 400 22px/1.2 var(--serif);margin:0 0 4px;letter-spacing:-.01em}
h3{
  font:600 11px/1.3 var(--sans);margin:0 0 14px;
  text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
}
.muted{color:var(--muted)}.small{font-size:13px}

/* ── STICKY DAY SUMMARY ── */
.day-sticky{
  position:sticky;top:var(--header-h,128px);z-index:10;
  background:rgba(245,245,240,.95);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding-bottom:10px;margin-bottom:0;
}
.day-sticky .panel{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:0}
.day-sticky .addbar{
  margin-bottom:0;background:var(--surface);
  border:1px solid var(--line);border-top:0;
  border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r);
  padding:10px 14px;
}

.fill{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.big-num{font:italic 300 44px/1 var(--serif);letter-spacing:-.02em}
.big-num span{font-size:17px;color:var(--muted);font-weight:300;font-family:var(--sans);font-style:normal}
.strip{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--surface-3);margin-bottom:14px;gap:1px}
.strip i{display:block;height:100%;border-radius:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:-.5px}

/* ── BUTTONS ── */
.primary{
  background:var(--accent);color:var(--accent-ink);border:0;
  border-radius:var(--r-sm);padding:12px 20px;
  font:600 14px var(--sans);transition:background .14s,transform .1s;
}
.primary:hover{background:var(--accent-2);transform:translateY(-1px)}
.ghost{
  background:var(--surface-2);border:1px solid var(--line2);
  border-radius:var(--r-sm);padding:11px 18px;
  font:500 14px var(--sans);color:var(--ink-2);transition:background .12s;
}
.ghost:hover{background:var(--surface-3)}
.danger{
  background:var(--warn-soft);border:1px solid rgba(255,69,58,.3);
  color:var(--warn);border-radius:var(--r-sm);padding:11px 18px;font:500 14px var(--sans);
}
.addbar{display:flex;gap:10px;margin-bottom:14px}
.addbar .primary{flex:1;padding:14px;font-size:15px;border-radius:0}

/* ── AGENDA ── */
.agenda{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;
}
.grid{position:relative;height:calc(var(--hour)*24);margin-left:52px}
.hrow{position:absolute;left:-52px;right:0;height:var(--hour);border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow span{position:absolute;left:10px;top:4px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.hrow button{position:absolute;left:52px;right:0;top:0;bottom:0;border:0;background:transparent;border-left:1px solid var(--line)}
.hrow button:hover{background:var(--accent-soft)}
.block{
  position:absolute;left:6px;right:8px;border-radius:10px;border:0;
  border-left:3px solid var(--c);
  background:color-mix(in srgb,var(--c) 10%,var(--surface));
  text-align:left;padding:4px 9px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-start;
  transition:background .1s;
}
.block:hover{background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.block .t{font:600 12px/1.3 var(--sans);color:var(--ink)}
.block .n{font-size:11px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block.sleep-merged{
  background:color-mix(in srgb,var(--c) 8%,var(--surface));
  border-left:3px solid var(--c);
  border-radius:10px;
}
.block.sleep-merged .t{opacity:.7}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--warn);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--warn)}

/* ── SHEET ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;backdrop-filter:blur(4px)}
.scrim.open{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  background:var(--surface);border-radius:22px 22px 0 0;
  max-height:92%;overflow:auto;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-width:560px;margin:0 auto;
}
.sheet.open{transform:none}
@media(min-width:700px){
  .sheet{bottom:auto;top:50%;border-radius:20px;transform:translateY(-42%) scale(.97);opacity:0;pointer-events:none;transition:opacity .18s,transform .2s}
  .sheet.open{transform:translateY(-50%);opacity:1;pointer-events:auto}
}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 20px}
.sheet h2{margin-bottom:16px;font:italic 400 22px var(--serif)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tlabel{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.07em}
.picker{
  position:relative;display:flex;align-items:center;justify-content:center;gap:2px;
  background:var(--surface-2);border-radius:14px;border:1px solid var(--line2);
  height:180px;overflow:hidden;
}
.picker::before{
  content:"";position:absolute;left:8px;right:8px;top:50%;height:42px;
  transform:translateY(-50%);background:var(--surface-3);border-radius:10px;
  border:1px solid var(--line2);pointer-events:none;
}
.picker::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(var(--surface-2),transparent 35%,transparent 65%,var(--surface-2));
}
.picker .colon{position:relative;z-index:1;font:italic 400 24px var(--serif);color:var(--muted)}
.wheel{
  position:relative;z-index:1;height:100%;width:58px;
  overflow-y:scroll;scroll-snap-type:y mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  padding:69px 0;overscroll-behavior:contain;
}
.wheel::-webkit-scrollbar{display:none}
.wheel div{
  height:42px;display:grid;place-items:center;scroll-snap-align:center;
  font:300 24px/1 var(--serif);font-variant-numeric:tabular-nums;
  color:var(--muted);cursor:pointer;user-select:none;transition:color .1s;
}
.wheel div.sel{color:var(--ink);font-weight:400}
.dur-display{margin:10px 0 18px;font-size:13px;color:var(--muted)}
.dur-display b{color:var(--ink);font-weight:600}
.cats{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.cats label{position:relative}
.cats input{position:absolute;opacity:0;inset:0;cursor:pointer}
.cats span{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:999px;
  border:1px solid var(--line2);background:var(--surface-2);
  font:500 13px var(--sans);transition:border-color .12s,background .12s;
}
.cats span b{width:7px;height:7px;border-radius:50%;background:var(--c);flex-shrink:0}
.cats input:checked+span{
  border-color:var(--c);
  background:color-mix(in srgb,var(--c) 16%,var(--surface));
  font-weight:600;
}
textarea{
  width:100%;min-height:72px;border-radius:12px;
  border:1px solid var(--line2);background:var(--surface-2);
  padding:11px 13px;resize:vertical;
  font:400 14px/1.5 var(--sans);color:var(--ink);
}
textarea:focus{outline:none;border-color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.actions .primary{flex:1}
.warnmsg{color:var(--warn);font-size:13px;margin-top:10px;min-height:1em}

/* ── TABLES ── */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:10px 11px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 10px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
th:first-child,td:first-child{text-align:left}
td .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:0}
tr.total td{font-weight:700;border-bottom:0;border-top:2px solid var(--line2)}
.up{color:var(--good)}.down{color:var(--warn)}.flat{color:var(--muted)}
.zero-subhead td{
  padding:8px 11px 5px;font-size:10px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;border-bottom:0;background:var(--bg2);
}
.outros-toggle{
  background:none;border:none;cursor:pointer;padding:0 0 0 6px;
  color:var(--muted);font-size:11px;vertical-align:middle;
  transition:transform .18s;line-height:1;
}
.outros-toggle.open{transform:rotate(90deg)}

/* ── KPIs ── */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.kpi{
  background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:14px 13px;
}
.kpi .v{font:italic 300 28px/1.1 var(--serif)}
.kpi .k{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.3;letter-spacing:.01em}
@media(max-width:400px){.kpi .v{font-size:22px}.kpis{gap:7px}}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px var(--sans)}

/* ── INSIGHTS ── */
.insight-block{
  background:linear-gradient(135deg,rgba(43,107,78,.06) 0%,rgba(26,107,191,.04) 100%);
  border:1px solid rgba(43,107,78,.2);border-radius:var(--r);padding:18px;margin-bottom:14px;
}
.insight-title{
  font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.08em;
  color:var(--accent);margin:0 0 14px;
}
.insight-item{
  display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);
  font-size:14px;line-height:1.5;
}
.insight-item:last-child{border-bottom:0;padding-bottom:0}
.insight-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.insight-text{color:var(--ink-2)}
.insight-good{color:var(--good)}
.insight-warn{color:var(--gold)}
.insight-alert{color:var(--warn)}

/* ── GOALS ── */
.goals-accordion{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:14px;overflow:hidden;
}
.goals-accordion-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;cursor:pointer;user-select:none;
  transition:background .12s;
}
.goals-accordion-header:hover{background:var(--surface-2)}
.goals-accordion-header h3{margin:0;font:600 13px var(--sans);color:var(--ink);text-transform:none;letter-spacing:0}
.goals-accordion-arrow{color:var(--muted);transition:transform .2s;font-size:13px}
.goals-accordion-arrow.open{transform:rotate(180deg)}
.goals-accordion-body{display:none;padding:0 18px 18px}
.goals-accordion-body.open{display:block}
.goals-table{width:100%;border-collapse:collapse;font-size:14px}
.goals-table th{
  font:600 10px var(--sans);color:var(--muted);text-transform:uppercase;
  letter-spacing:.08em;padding:8px 10px;border-bottom:2px solid var(--line2);text-align:left;
}
.goals-table th:not(:first-child){text-align:center}
.goals-table td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.goals-table td:not(:first-child){text-align:center}
.goals-table tr:last-child td{border-bottom:0}
.goals-table tr.disabled td:nth-child(n+3){opacity:.35;pointer-events:none}
.goal-cat{display:flex;align-items:center;gap:9px;font:500 13px var(--sans)}
.goal-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.goal-num{
  width:52px;text-align:center;border:1px solid var(--line2);border-radius:8px;
  background:var(--surface-2);padding:7px 4px;font:500 15px var(--sans);
  font-variant-numeric:tabular-nums;color:var(--ink);
}
.goal-num:focus{outline:none;border-color:var(--accent)}
.goal-sel{
  border:1px solid var(--line2);border-radius:8px;background:var(--surface-2);
  padding:7px 8px;font:500 12px var(--sans);appearance:none;cursor:pointer;
  text-align:center;color:var(--ink);
}
.goal-sel:focus{outline:none;border-color:var(--accent)}

/* PROGRESS */
.progress-filter{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;
}
.progress-filter label{font-size:12px;color:var(--muted);font-weight:500}
.progress-filter input[type=date]{
  background:var(--surface-2);border:1px solid var(--line2);
  border-radius:8px;padding:7px 10px;font-size:13px;color:var(--ink);
  cursor:pointer;
}
.progress-filter input[type=date]:focus{outline:none;border-color:var(--accent)}
.gp-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.gp-row:last-child{border-bottom:0}
.gp-label{flex:0 0 130px;display:flex;align-items:center;gap:8px;font:500 13px var(--sans);min-width:0}
.gp-label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.gp-bar-wrap{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:40px}
.gp-bar{height:100%;border-radius:3px;background:var(--accent);transition:width .4s cubic-bezier(.4,0,.2,1)}
.gp-bar.over{background:var(--gold)}
.gp-nums{font:500 12px var(--sans);color:var(--muted);white-space:nowrap;min-width:90px;text-align:right}
.gp-nums b{color:var(--ink);font-weight:600}
.no-goals{text-align:center;color:var(--muted);padding:28px 16px;font-size:14px}
.section-label{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:16px 0 8px}

/* EXPORT */
.export-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.export-row label{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:4px;display:block}
.export-row input[type=date]{
  background:var(--surface-2);border:1px solid var(--line2);border-radius:8px;
  padding:8px 10px;font-size:13px;color:var(--ink);cursor:pointer;
}
.export-row input[type=date]:focus{outline:none;border-color:var(--accent)}
.export-row select{
  background:var(--surface-2);border:1px solid var(--line2);border-radius:8px;
  padding:8px 10px;font-size:13px;color:var(--ink);cursor:pointer;appearance:none;
}

/* MONTH */
.cat-sel-wrap{margin-bottom:16px}
.cat-sel-wrap select{
  width:100%;border:1px solid var(--line2);border-radius:10px;background:var(--surface-2);
  padding:10px 13px;font:500 14px var(--sans);appearance:none;cursor:pointer;color:var(--ink);

<script type="module">

/* ── CATEGORIES ── */
const CATS=[
  {id:'dormir',label:'Dormir',color:'#636FD3'},

const CATS_ALPHA=[...CATS].filter(c=>c.id!=='outros').sort((a,b)=>a.label.localeCompare(b.label,'pt-BR')).concat(CATS.filter(c=>c.id==='outros'));
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const DOW=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const DOW3=['dom','seg','ter','qua','qui','sex','sáb'];
const MON=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MONTH_NAMES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const SEED=[
  {date:"2026-09-22",entries:[
    {cat:"dormir",end:1440,id:"vc95i35jhcgq",note:"",start:1380},
    {cat:"redes",end:1380,id:"zx15rm0eho85",note:"",start:1350},
    {cat:"comer",end:1320,id:"lzxutyfyhwby",note:"",start:1290},
    {cat:"estudar",end:1200,id:"lk93ki54k49k",note:"Claude",start:1080},
    {cat:"cuidados",end:1230,id:"o3gaj37yn1xw",note:"",start:1200},
    {cat:"estudar",end:1260,id:"j36gyoemnth1",note:"",start:1230}
  ]},
  {date:"2026-09-23",entries:[
    {cat:"dormir",end:525,id:"3fg92i0l1bzt",note:"",start:0},

];

const S={
  days:{},tab:'dia',date:'',uid:null,editing:null,seenReport:null,
  goals:{},monthCat:'trabalhar',
  monthYear:new Date().getFullYear(),monthMonth:new Date().getMonth(),
  progressFrom:'',progressTo:'',
  goalsOpen:false,
};
const $=id=>document.getElementById(id);
let unsubDays=null;

/* ── DATE HELPERS ── */
function pad(n){return String(n).padStart(2,'0')}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayKey(){return keyOf(new Date())}
function parse(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=parse(k);d.setDate(d.getDate()+n);return keyOf(d)}
function weekStart(k){const d=parse(k);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return keyOf(d)}
function niceDate(k){const d=parse(k);return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]}
function shortDate(k){const d=parse(k);return d.getDate()+'/'+pad(d.getMonth()+1)}
function hm(m){return pad(Math.floor(m/60)%24===0&&m===1440?24:Math.floor(m/60))+':'+pad(m%60)}
function dur(m){m=Math.round(m);const h=Math.floor(Math.abs(m)/60),mn=Math.abs(m)%60;if(!h)return mn+'min';return h+'h'+(mn?pad(mn):'')}
function durSigned(m){if(Math.round(m)===0)return'—';return(m>0?'+':'−')+dur(Math.abs(m))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ── SYNC UI ── */
function setSync(state,label){
  const dot=$('syncDot'),lbl=$('syncLabel');
  dot.className='sync-dot '+state;
  lbl.textContent=label;
}

/* ── FIRESTORE ── */
function userDaysCol(){return collection(db,'users',S.uid,'days')}
const writing={};
function persist(date){
  if(!S.uid)return;
  const data=JSON.parse(JSON.stringify(S.days[date]||{date,entries:[]}));
  const ref=doc(userDaysCol(),'d-'+date);
  setSync('saving','Salvando…');
  const run=()=>setDoc(ref,data).then(()=>setSync('','Sincronizado ✓')).catch(e=>{setSync('error','Erro');console.warn(e)});
  writing[date]=(writing[date]||Promise.resolve()).then(run,run);
}
function persistGoals(){
  if(!S.uid)return;
  setDoc(doc(db,'users',S.uid,'meta','goals'),JSON.parse(JSON.stringify(S.goals))).catch(e=>console.warn(e));
}

/* ── AUTH ── */
onAuthStateChanged(auth,async user=>{
  if(user){
    S.uid=user.uid;
    $('loginScreen').classList.add('hidden');
    $('app').classList.remove('hidden');
    initPickers();
    $('userName').textContent=user.displayName?.split(' ')[0]||'';
    const av=$('userAvatar');
    if(user.photoURL){av.src=user.photoURL;av.style.display='block'}
    $('userBtn').onclick=()=>{if(confirm('Sair da conta?'))signOut(auth)};
    S.date=todayKey();
    // Init progress dates to current week
    const ws=weekStart(todayKey());
    S.progressFrom=ws;S.progressTo=todayKey();
    try{const gs=await getDoc(doc(db,'users',S.uid,'meta','goals'));if(gs.exists())S.goals=gs.data()}catch(e){}
    if(unsubDays)unsubDays();
    const q=query(userDaysCol(),limit(500));
    let firstSnap=true;
    unsubDays=onSnapshot(q,snap=>{
      const days={};
      snap.forEach(d=>{const v=d.data();if(v&&v.date)days[v.date]=v});
      if(firstSnap){
        firstSnap=false;
        if(Object.keys(days).length===0){
          SEED.forEach(day=>{
            setDoc(doc(userDaysCol(),'d-'+day.date),JSON.parse(JSON.stringify(day))).catch(e=>console.warn(e));
            days[day.date]=JSON.parse(JSON.stringify(day));
          });
        }
      }
      S.days=days;setSync('','Sincronizado ✓');render();
    },err=>{setSync('error','Offline');console.warn(err)});
    setHeaderVar();render();
  }else{
    S.uid=null;$('app').classList.add('hidden');$('loginScreen').classList.remove('hidden');
  }
});
$('loginBtn').onclick=async()=>{
  try{await signInWithPopup(auth,new GoogleAuthProvider())}
  catch(e){$('loginError').classList.remove('hidden');console.warn(e)}
};
function setHeaderVar(){const h=$('topHeader');if(h)document.documentElement.style.setProperty('--header-h',h.offsetHeight+'px')}
window.addEventListener('resize',setHeaderVar);

/* ── STATS ── */
function entries(k){return(S.days[k]&&S.days[k].entries)||[]}

/* Sleep: find the continuous sleep block that ENDS on day k (at start of day, i.e. start=0)
   and trace back to when it actually started, which may be the previous day */
function sleepTotalForDay(k){
  const es=entries(k);
  // Morning fragment on this day (start=0, cat=dormir)
  const morningFrag=es.filter(e=>e.cat==='dormir'&&e.start===0);
  // Night fragment at end of this day (end=1440, cat=dormir) → belongs to next day's sleep
  const nightFrag=es.filter(e=>e.cat==='dormir'&&e.end===1440);
  // Sleep starting today (not at midnight)
  const dayFrag=es.filter(e=>e.cat==='dormir'&&e.start>0&&e.end<1440);

  let total=0;
  // Add morning continuation from previous night
  if(morningFrag.length){
    morningFrag.forEach(f=>total+=f.end-f.start);
    // Add the prev-night fragment
    entries(addDays(k,-1)).forEach(e=>{if(e.cat==='dormir'&&e.end===1440)total+=e.end-e.start});
  }
  // Add standalone daytime sleep
  dayFrag.forEach(f=>total+=f.end-f.start);
  // Night frag (end=1440) does NOT count for today — it counts for tomorrow
  return total;
}

function totals(k){
  const t=Object.fromEntries(CATS.map(c=>[c.id,0]));
  const es=entries(k);es.forEach(e=>{t[e.cat]=(t[e.cat]||0)+(e.end-e.start)});
  const iv=es.map(e=>[e.start,e.end]).sort((a,b)=>a[0]-b[0]);
  let cov=0,cs=-1,ce=-1;
  iv.forEach(([s,e])=>{if(s>ce){if(ce>cs)cov+=ce-cs;cs=s;ce=e}else ce=Math.max(ce,e)});
  if(ce>cs)cov+=ce-cs;
  t.sem=Math.max(0,1440-cov);t._cov=cov;t._sleep=sleepTotalForDay(k);return t;
}
function hasData(k){return entries(k).length>0}
function sumRange(keys){
  const t=Object.fromEntries(CATS.map(c=>[c.id,0]));t.sem=0;t._cov=0;t._sleep=0;
  keys.forEach(k=>{const x=totals(k);Object.keys(t).forEach(c=>{if(c in x)t[c]+=x[c]})});return t;
}
function avgRange(keys){
  const wd=keys.filter(hasData);const n=wd.length;const s=sumRange(wd);
  if(!n)return null;Object.keys(s).forEach(c=>s[c]/=n);s._n=n;return s;
}

/* ── RENDER HELPERS ── */
function strip(t){
  let h='';CATS.forEach(c=>{if(t[c.id]>0)h+=`<i style="width:${Math.min(100,t[c.id]/1440*100)}%;background:${c.color}"></i>`});
  return`<div class="strip">${h}</div>`;
}
function legend(t){
  return`<div class="legend">${CATS.filter(c=>t[c.id]>0).map(c=>`<span><b style="background:${c.color}"></b>${c.label} <strong>${dur(t[c.id])}</strong></span>`).join('')}${t.sem>0?`<span><b style="background:var(--line2)"></b>Livre ${dur(t.sem)}</span>`:''}</div>`;
}
function varCell(a,b){const d=a-b;if(Math.round(d)===0)return`<td class="flat">—</td>`;return`<td class="${d>0?'up':'down'}">${durSigned(d)}</td>`}
function stackedDays(keys,highlight){
  const W=640,H=220,left=30,bottom=24,top=8,n=keys.length,gap=6,bw=(W-left-gap*(n+1))/n,ph=H-top-bottom;
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  [0,8,16,24].forEach(h=>{const y=top+ph-h/24*ph;s+=`<line x1="${left}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${h===0||h===24?'none':'3,3'}"/><text x="0" y="${y+4}" style="font-size:10px;fill:var(--muted)">${h}h</text>`});
  keys.forEach((k,i)=>{
    const t=totals(k),x=left+gap+i*(bw+gap);let y=top+ph;
    CATS.forEach(c=>{const h2=Math.min(t[c.id],1440)/1440*ph;if(h2>0){y-=h2;s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h2}" fill="${c.color}" rx="2"><title>${c.label}: ${dur(t[c.id])}</title></rect>`}});
    const d=parse(k),isHL=k===highlight;
    if(isHL)s+=`<rect x="${x-2}" y="${top-2}" width="${bw+4}" height="${ph+4}" rx="5" fill="none" stroke="var(--accent)" stroke-width="1.5"/>`;
    s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" style="font-size:${isHL?11:10}px;${isHL?'fill:var(--accent);font-weight:600':'fill:var(--muted)'}">${DOW3[d.getDay()]}</text>`;
  });
  return s+`</svg>`;
}

/* ── INSIGHTS ENGINE ── */
function generateInsights(k){
  const t=totals(k),p=addDays(k,-1),tp=totals(p);
  const last7=[1,2,3,4,5,6,7].map(i=>addDays(k,-i));
  const avg=avgRange(last7.filter(hasData));
  const items=[];
  const sleep=t._sleep;
  const sleepHours=sleep/60;

  // Sleep analysis
  if(sleep>0){
    if(sleepHours>=7.5)items.push({icon:'🌙',text:`Sono de ${dur(sleep)} — ótimo para recuperação e foco.`,type:'good'});
    else if(sleepHours>=6)items.push({icon:'🌙',text:`Sono de ${dur(sleep)} — adequado, mas abaixo do ideal. Tente chegar a 7h30.`,type:'warn'});
    else if(sleep>0)items.push({icon:'😴',text:`Apenas ${dur(sleep)} de sono. Isso compromete foco e disposição no dia seguinte.`,type:'alert'});
  }

  // Focus (trabalhar + estudar + escrever)
  const focus=t.trabalhar+t.estudar+t.escrever;
  const focusAvg=avg?(avg.trabalhar+avg.estudar+avg.escrever):0;
  if(focus>0){
    if(focus>=240)items.push({icon:'🎯',text:`${dur(focus)} de foco — excelente produtividade.`,type:'good'});
    else if(focus>=120)items.push({icon:'🎯',text:`${dur(focus)} de foco. Há espaço para crescer — sua média é ${dur(focusAvg)}.`,type:'warn'});
    else items.push({icon:'⚡',text:`Apenas ${dur(focus)} de foco hoje. Avalie o que desviou sua atenção.`,type:'alert'});
    if(avg&&focus>focusAvg*1.15)items.push({icon:'📈',text:`Foco ${Math.round((focus/focusAvg-1)*100)}% acima da sua média — ótimo ritmo.`,type:'good'});
    else if(avg&&focus<focusAvg*0.7&&focusAvg>60)items.push({icon:'📉',text:`Foco abaixo da média (${dur(focusAvg)}). Verifique o que tomou mais tempo.`,type:'warn'});
  }

  // Screen time
  if(t.redes>60)items.push({icon:'📱',text:`${dur(t.redes)} em redes sociais — acima de 1h. Vale avaliar se foi intencional.`,type:'warn'});
  else if(t.redes>0&&t.redes<=60)items.push({icon:'📱',text:`${dur(t.redes)} em redes sociais — dentro do controle.`,type:'good'});

  // Movement
  if(t.treinar>0)items.push({icon:'🏃',text:`${dur(t.treinar)} de treino — movimento no dia faz diferença no humor e energia.`,type:'good'});
  else if(avg&&avg.treinar>0)items.push({icon:'🏃',text:`Sem treino hoje. Você costuma treinar ${dur(avg.treinar)} em média.`,type:'warn'});

  // Goals check
  const goalsWithData=CATS_ALPHA.filter(c=>{const g=S.goals[c.id];return g&&g.qty>0&&g.period==='dia'});
  goalsWithData.forEach(c=>{
    const g=S.goals[c.id];
    const actual=c.id==='dormir'?t._sleep:t[c.id];
    if(g.unit==='hora'||g.unit==='horas'){
      const target=g.qty*60;
      if(actual>=target)items.push({icon:'✅',text:`Meta de ${c.label} atingida: ${dur(actual)} de ${dur(target)}.`,type:'good'});
      else if(actual>0)items.push({icon:'🎯',text:`${c.label}: ${dur(actual)} de ${dur(target)} registrados.`,type:'warn'});
    }
  });

  // Unregistered time
  if(t.sem>360)items.push({icon:'📋',text:`${dur(t.sem)} sem registro. Tente capturar mais blocos para uma análise completa.`,type:'warn'});

  // Comparison with previous day
  const focusPrev=tp.trabalhar+tp.estudar+tp.escrever;
  if(hasData(p)&&focus>0&&focusPrev>0){
    const diff=focus-focusPrev;
    if(Math.abs(diff)>30){
      const diffLabel=diff>0?dur(diff)+' a mais':dur(Math.abs(diff))+' a menos';items.push({icon:'📊',text:`Foco ${diffLabel} que ontem (${dur(focusPrev)}).`,type:diff>0?'good':'warn'});
    }
  }

  if(items.length===0)items.push({icon:'📋',text:'Adicione mais logs para receber insights personalizados.',type:'warn'});
  return items.slice(0,5);
}

    <div class="panel">

  // Merge sleep blocks visually if total > 3h
  const sleepBlocks=es.filter(e=>e.cat==='dormir');
  const sleepTotal180=sleepBlocks.reduce((s,e)=>s+(e.end-e.start),0);
  const mergedSleepIds=new Set();
  if(sleepTotal180>180&&sleepBlocks.length>1){
    // Find the full span
    const allSleepEs=sleepBlocks.slice().sort((a,b)=>a.start-b.start);
    // Include prev-night fragment if morning starts at 0
    let displayStart=allSleepEs[0].start;
    let displayEnd=allSleepEs[allSleepEs.length-1].end;
    // If first block starts at 0, the real start is from previous night
    if(allSleepEs[0].start===0){
      const prevNightFrags=entries(addDays(k,-1)).filter(e=>e.cat==='dormir'&&e.end===1440);
      if(prevNightFrags.length){displayStart=-prevNightFrags.reduce((s,e)=>s+(e.end-e.start),0)}
    }
    allSleepEs.forEach(e=>mergedSleepIds.add(e.id));
    const mergedMin=sleepTotalForDay(k);
    const top2=Math.max(0,displayStart)/60;
    const hgt=Math.max(mergedMin/60,.25);
    const c=CAT.dormir;
    const startLabel=displayStart<0?`00:00`:hm(displayStart);
    html+=`<button class="block sleep-merged" style="--c:${c.color};top:calc(var(--hour)*${top2} + 1px);height:calc(var(--hour)*${hgt} - 2px)"><span class="t">Dormir · ${startLabel}–${hm(displayEnd===1440?1440:displayEnd)}</span><span class="n">${dur(mergedMin)} no total</span></button>`;
  }

  es.forEach(e=>{
    if(mergedSleepIds.has(e.id))return;
    const c=CAT[e.cat]||CAT.outros;
    const top2=e.start/60,hgt=Math.max((e.end-e.start)/60,.25);
    const short=(e.end-e.start)<45;
    html+=`<button class="block" data-id="${e.id}" style="--c:${c.color};top:calc(var(--hour)*${top2} + 1px);height:calc(var(--hour)*${hgt} - 2px);${short?'flex-direction:row;align-items:center;gap:8px;':''}"><span class="t">${c.label} · ${hm(e.start)}–${hm(e.end)}</span>${e.note?`<span class="n">${esc(e.note)}</span>`:''}</button>`;
  });
  if(k===today){const n=new Date();html+=`<div class="nowline" style="top:calc(var(--hour)*${(n.getHours()*60+n.getMinutes())/60})"></div>`}
  html+=`</div></div>`;
  v.innerHTML=html;
  $('addBtn').onclick=()=>openSheet(null);
  const orp=$('openReport');if(orp)orp.onclick=()=>{S.date=yesterday;setTab('relatorio')};
  v.querySelectorAll('.hrow button').forEach(b=>b.onclick=()=>openSheet(null,Number(b.dataset.hour)*60));
  v.querySelectorAll('.block[data-id]').forEach(b=>b.onclick=()=>openSheet(b.dataset.id));
}

/* ── GOALS ── */
function goalUnitOptions(qty,period){const p=qty!==1;return[['hora',p?'horas':'hora'],['vez',p?'vezes':'vez']].map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}
function periodOptions(){return['dia','semana','mês'].map(p=>`<option value="${p}">${p}</option>`).join('')}

function goalProgressForRange(catId,goal,fromKey,toKey){
  const{qty,unit,period}=goal;
  // Build period keys based on goal's period type, proportional to selected range
  let allPeriodKeys=[];
  const today=todayKey();
  if(period==='dia'){
    // Daily: count each day in range
    let k=fromKey;
    while(k<=toKey&&k<=today){allPeriodKeys.push(k);k=addDays(k,1)}
  }else if(period==='semana'){
    // Weekly: count weeks that overlap with range
    let k=fromKey;
    while(k<=toKey&&k<=today){allPeriodKeys.push(k);k=addDays(k,1)}
  }else{
    let k=fromKey;
    while(k<=toKey&&k<=today){allPeriodKeys.push(k);k=addDays(k,1)}
  }
  const days=allPeriodKeys.length;
  if(!days)return{realized:0,expected:0,unit,period};

  // Proportional expected
  let expected=0;
  if(period==='dia')expected=qty*days;
  else if(period==='semana')expected=qty*(days/7);
  else expected=qty*(days/30);

  // Realized
  let realized=0;
  if(unit==='hora'||unit==='horas'){
    realized=allPeriodKeys.reduce((s,k)=>{const t=totals(k);return s+(catId==='dormir'?t._sleep:t[catId])},0)/60;
  }else{
    if(period==='dia')realized=allPeriodKeys.reduce((s,k)=>s+entries(k).filter(e=>e.cat===catId).length,0);
    else realized=allPeriodKeys.filter(k=>entries(k).some(e=>e.cat===catId)).length;
  }
  return{realized,expected,unit,period,days};
}

function buildProgressHTML(fromKey,toKey){
  const hasGoals=CATS_ALPHA.some(c=>(S.goals[c.id]||{}).qty>0);
  if(!hasGoals)return`<div class="no-goals">Configure uma meta acima para ver o progresso aqui.</div>`;
  let h=`<div class="panel">`;
  CATS_ALPHA.forEach(c=>{
    const g=S.goals[c.id];if(!g||!g.qty)return;
    const{realized,expected,unit,period,days}=goalProgressForRange(c.id,g,fromKey,toKey);
    if(!expected)return;
    const pct=Math.min(realized/expected,1.5),pctBar=Math.min(pct,1),over=realized>expected;
    const ul=g.qty===1?(unit==='hora'?'hora':'vez'):(unit==='hora'?'horas':'vezes');
    const rl=(unit==='hora'||unit==='horas')?dur(realized*60):Math.round(realized)+' '+ul;
    const el=(unit==='hora'||unit==='horas')?dur(expected*60):expected.toFixed(1).replace('.0','')+(expected===1?(unit==='hora'?'hora':'vez'):(unit==='hora'?'horas':'vezes'));
    h+=`<div class="gp-row"><div class="gp-label"><div class="goal-dot" style="background:${c.color}"></div><span>${c.label}</span></div><div class="gp-bar-wrap"><div class="gp-bar${over?' over':''}" style="width:${Math.round(pctBar*100)}%"></div></div><div class="gp-nums"><b>${rl}</b> / ${el}</div></div>`;
  });
  return h+`</div>`;
}

        <div><label>De</label><input type="date" id="exportFrom" value="${minDate}" min="${minDate}" max="${maxDate}"></div>
        <div><label>Até</label><input type="date" id="exportTo" value="${maxDate}" min="${minDate}" max="${maxDate}"></div>
        <div><label>Formato</label><select id="exportFmt"><option value="csv">CSV</option><option value="json">JSON</option></select></div>
      </div>
      <button class="primary" id="exportBtn" style="width:100%;margin-top:6px">Baixar arquivo</button>
    </div>`;
  v.innerHTML=html;
  $('exportBtn').onclick=()=>{
    const from=$('exportFrom').value,to=$('exportTo').value,fmt=$('exportFmt').value;
    const keys=Object.keys(S.days).filter(k=>k>=from&&k<=to).sort();
    if(!keys.length){alert('Nenhum dado no período selecionado.');return}
    if(fmt==='json'){
      const data={exported:new Date().toISOString(),period:{from,to},days:{}};
      keys.forEach(k=>{
        const es=entries(k);
        data.days[k]={date:k,entries:es.map(e=>({start:hm(e.start),end:hm(e.end),category:CAT[e.cat]?.label||e.cat,notes:e.note||''}))};
        if(!es.length)data.days[k].entries=[];
      });
      download(JSON.stringify(data,null,2),`minhas-horas-${from}-${to}.json`,'application/json');
    }else{
      let csv='Data,Início,Fim,Categoria,Notas\n';
      // Add blank rows for days with no data in range
      let k=from;
      while(k<=to){
        const es=entries(k);
        if(es.length){
          es.sort((a,b)=>a.start-b.start).forEach(e=>{
            csv+=`${k},${hm(e.start)},${hm(e.end)},"${CAT[e.cat]?.label||e.cat}","${(e.note||'').replace(/"/g,'""')}"\n`;
          });
        }else{
          csv+=`${k},,,,""\n`;
        }
        k=addDays(k,1);
      }
      download(csv,`minhas-horas-${from}-${to}.csv`,'text/csv');
    }
  };
}
function download(content,filename,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=filename;a.click();URL.revokeObjectURL(a.href);
}

/* ── WHEEL PICKER ── */
function makeWheel(values,onChange){
  const w=document.createElement('div');w.className='wheel';w.tabIndex=0;
  values.forEach((v,i)=>{const d=document.createElement('div');d.textContent=pad(v);d.onclick=()=>set(i,true);w.appendChild(d)});
  let idx=0,tmr=null;
  function mark(){[...w.children].forEach((c,i)=>c.classList.toggle('sel',i===idx))}
  function set(i,smooth){idx=Math.max(0,Math.min(values.length-1,i));w.scrollTo({top:idx*42,behavior:smooth?'smooth':'auto'});mark();onChange()}
  w.addEventListener('scroll',()=>{clearTimeout(tmr);tmr=setTimeout(()=>{const i=Math.round(w.scrollTop/42);if(i!==idx){idx=Math.max(0,Math.min(values.length-1,i));mark();onChange()}},90)});
  w.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();set(idx+1,true)}if(e.key==='ArrowUp'){e.preventDefault();set(idx-1,true)}});
  return{el:w,get:()=>values[idx],setValue:v=>{const i=values.indexOf(v);idx=i<0?0:i;mark();requestAnimationFrame(()=>{w.scrollTop=idx*42})}};
}
function makeTimePicker(host,onChange){
  const H=makeWheel([...Array(24).keys()],onChange),M=makeWheel([0,15,30,45],onChange);
  const colon=document.createElement('span');colon.className='colon';colon.textContent=':';
  host.append(H.el,colon,M.el);
  return{get:()=>H.get()*60+M.get(),set:m=>{m=((m%1440)+1440)%1440;H.setValue(Math.floor(m/60));M.setValue(Math.round((m%60)/15)*15%60)}};
}
// Pickers initialized lazily after app is shown (elements are in hidden div at load time)
let pS,pE,pickersReady=false;
function initPickers(){
  if(pickersReady)return;
  pickersReady=true;
  pS=makeTimePicker($('pickStart'),updateDur);
  pE=makeTimePicker($('pickEnd'),updateDur);
  $('cats').innerHTML=CATS_ALPHA.map(c=>`<label style="--c:${c.color}"><input type="radio" name="cat" value="${c.id}" ${c.id==='trabalhar'?'checked':''}><span><b></b>${c.label}</span></label>`).join('');
  // Wire sheet buttons
  $('cancel').onclick=closeSheet;
  $('scrim').onclick=closeSheet;
  $('save').onclick=saveEntry;
  $('del').onclick=delEntry;
}
let confirmOverlap=false;
function span2(){let s=pS.get(),e=pE.get();if(e===0&&s>0)e=1440;return{s,e}}
function updateDur(){
  confirmOverlap=false;$('save').textContent=S.editing?'Salvar alterações':'Salvar';$('warn').textContent='';
  const{s,e}=span2();
  if(e===s){$('dur').innerHTML='Início e fim iguais';return}
  if(e<s){$('dur').innerHTML=`Duração: <b>${dur(1440-s+e)}</b> · termina no dia seguinte`;return}
  $('dur').innerHTML=`Duração: <b>${dur(e-s)}</b>`;
}
function openSheet(id,startAt){
  S.editing=id;const es=entries(S.date);
  $('warn').textContent='';confirmOverlap=false;
  if(id){
    const e=es.find(x=>x.id===id);if(!e)return;
    $('sheetTitle').textContent='Editar atividade';pS.set(e.start);pE.set(e.end===1440?0:e.end);
    document.querySelector(`#cats input[value="${e.cat}"]`).checked=true;$('note').value=e.note||'';$('del').classList.remove('hidden');
  }else{
    $('sheetTitle').textContent='Nova atividade';
    let s=startAt;
    if(s==null){
      // Point 3: default start = end of last entry
      const sorted=es.slice().sort((a,b)=>b.end-a.end);
      const last=sorted.length?sorted[0].end:-1;
      if(last>=0&&last<1440)s=last;
      else{const n=new Date();s=Math.floor((n.getHours()*60+n.getMinutes())/15)*15}
    }
    pS.set(s);pE.set(Math.min(s+60,1440)%1440);$('note').value='';$('del').classList.add('hidden');
  }
  updateDur();
  $('scrim').classList.add('open');$('sheet').classList.add('open');
  setTimeout(()=>$('save').focus({preventScroll:true}),50);
}
function closeSheet(){$('scrim').classList.remove('open');$('sheet').classList.remove('open');S.editing=null}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sheet').classList.contains('open'))closeSheet()});
function genId(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function ensureDay(k){return S.days[k]||(S.days[k]={date:k,entries:[]})}
function saveEntry(){
  const{s,e}=span2();if(e===s){$('warn').textContent='Escolha um horário de fim diferente do início.';return}
  const cat=document.querySelector('#cats input:checked').value,note=$('note').value.trim();
  const k=S.date,next=addDays(k,1);
  const parts=e>s?[[k,s,e]]:[[k,s,1440],[next,0,e]];
  if(!confirmOverlap){
    const clash=[];
    parts.forEach(([d,a,b])=>entries(d).forEach(x=>{if(x.id!==S.editing&&x.start<b&&a<x.end)clash.push(`${CAT[x.cat]?.label} ${hm(x.start)}–${hm(x.end)}`)}));
    if(clash.length){$('warn').textContent=`Sobreposição: ${clash.join(', ')}.`;$('save').textContent='Salvar mesmo assim';confirmOverlap=true;return}
  }
  if(S.editing){const d=ensureDay(k);d.entries=d.entries.filter(x=>x.id!==S.editing)}
  const touched=new Set();
  parts.forEach(([d,a,b])=>{ensureDay(d).entries.push({id:genId(),start:a,end:b,cat,note});touched.add(d)});
  if(S.editing)touched.add(k);
  touched.forEach(persist);closeSheet();render();
};
function delEntry(){const d=ensureDay(S.date);d.entries=d.entries.filter(x=>x.id!==S.editing);persist(S.date);closeSheet();render()}

/* ── NAV ── */
function setTab(tab){
  if(tab==='relatorio'&&S.tab!=='relatorio'&&S.date===todayKey())S.date=addDays(todayKey(),-1);
  S.tab=tab;render();window.scrollTo({top:0});
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('prev').onclick=()=>{
  if(S.tab==='mes'){S.monthMonth--;if(S.monthMonth<0){S.monthMonth=11;S.monthYear--}render();return}
  S.date=addDays(S.date,S.tab==='semana'?-7:-1);render();
};
$('next').onclick=()=>{
  if(S.tab==='mes'){S.monthMonth++;if(S.monthMonth>11){S.monthMonth=0;S.monthYear++}render();return}
  S.date=addDays(S.date,S.tab==='semana'?7:1);render();
};
$('goToday').onclick=()=>{
  if(S.tab==='mes'){S.monthYear=new Date().getFullYear();S.monthMonth=new Date().getMonth();render();return}
  S.date=S.tab==='relatorio'?addDays(todayKey(),-1):todayKey();render();
};

/* ── RENDER ── */
function render(){
  if(!S.uid)return;
  const tabs=['metas','dia','relatorio','semana','mes','exportar'];
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  tabs.forEach(t=>$('view-'+t).classList.toggle('hidden',t!==S.tab));
  if(S.tab==='mes'){$('dateLabel').textContent=MONTH_NAMES[S.monthMonth]+' '+S.monthYear;$('goToday').textContent='Este mês'}
  else if(S.tab==='semana'){const ws=weekStart(S.date);$('dateLabel').textContent=`${shortDate(ws)} – ${shortDate(addDays(ws,6))}`;$('goToday').textContent='Esta semana'}
  else if(S.tab==='metas'||S.tab==='exportar'){$('dateLabel').textContent='';$('goToday').textContent=''}
  else{$('dateLabel').textContent=S.date===todayKey()?'Hoje, '+niceDate(S.date).split(', ')[1]:niceDate(S.date);$('goToday').textContent=S.tab==='relatorio'?'Ontem':'Hoje'}
  if(S.tab==='dia'){renderDay();requestAnimationFrame(scrollAgenda)}
  else if(S.tab==='relatorio')renderReport();
  else if(S.tab==='semana')renderWeek();
  else if(S.tab==='metas')renderGoals();
  else if(S.tab==='mes')renderMonth();
  else if(S.tab==='exportar')renderExport();
}
setInterval(()=>{if(S.tab==='dia'&&S.date===todayKey()&&!$('sheet').classList.contains('open'))render()},5*60*1000);
</script>
